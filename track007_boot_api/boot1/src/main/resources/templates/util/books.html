<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head lang="ko">
<meta charset="UTF-8">
<title>BOOKS API AJAX</title> 
</head>
<body>
<div layout:fragment="content">
    <h3 class="card-header bg-success text-white">BOOKS API AJAX</h3>
    <div class="my-5">
        <label for="search">BOOK SEARCH</label>
        <input type="text" name="search" id="search" class="form-control"
               placeholder="책검색어를 입력해주세요">
    </div>
    <table class="table table-bordered table-striped table-hover book_result" style="display: none;">
        <caption>NAVER BOOK API</caption>
        <thead>
        <tr>
            <th scope="col">TITLE</th>
            <th scope="col">IMG</th>
            <th scope="col">AUTHOR</th>
        </tr>
        </thead>
        <tbody>
        <!-- 호출 후 내용이 업데이트 될 영역 -->
        </tbody>
    </table>

    <script th:inline="javascript"> 
        window.addEventListener("load", function() {
            let searchInput     = document.getElementById("search");
            let bookResultTable = document.querySelector(".book_result");
 
            // 1. 초기 호출 시에도 테이블이 보이도록 설정
            bookResultTable.style.display = "table"; 
            ajax_api('ai');

            searchInput.addEventListener("keyup", function() {
                let searchQuery = this.value.trim();
                if (searchQuery.length > 0) {
                    bookResultTable.style.display = "table"; 
                    ajax_api(searchQuery);
                }
            });
        });

        // fetch().then().then()을 활용한 API 호출 함수
        function ajax_api(search) {  
            fetch(`/api/util/books/json?search=${encodeURIComponent(search)}`)
            .then(response => { 
                if (!response.ok) { 
                    throw new Error(`${response.status} / ${response.statusText}`); 
                }
                return response.json(); // <-- [수정] JSON 데이터 형태로 변환하여 다음 then으로 넘겨줌
            })
            .then(json => { 
                console.log(json);
                const tbody = document.querySelector(".book_result tbody");
                tbody.innerHTML = "";

                if (json && json.length > 0) {
                    let rows = "";
                    for (let i = 0; i < json.length; i++) {
                        let title  = json[i].title;
                        let img    = json[i].image;
                        let author = json[i].author;
                        rows += `
                            <tr> 
                                <td>${title}</td>
                                <td><img src="${img}" alt="${title}" style="width:100px; height:auto;" /></td> 
                                <td>${author}</td>
                            </tr>
                        `;
                    } 
                    tbody.innerHTML = rows;
                } else { 
                    console.log("empty"); 
                    // 데이터가 없을 때 사용자에게 알림을 주는 row 추가 (선택사항)
                    tbody.innerHTML = `<tr><td colspan="3" class="text-center">검색 결과가 없습니다.</td></tr>`;
                }
            })
            .catch(error => { 
                alert("요청 실패: " + error.message);
            });
        }
    </script>
</div>
</body>
</html>
